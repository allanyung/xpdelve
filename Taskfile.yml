version: "3"

vars:
  CARGO: cargo

tasks:
  build:
    desc: Build xpdelve
    cmds:
      - '{{.CARGO}} build --locked {{.CLI_ARGS}}'

  test:
    desc: Run all tests
    cmds:
      - '{{.CARGO}} test --locked {{.CLI_ARGS}}'

  lint:
    desc: Run Clippy with warnings denied
    cmds:
      - '{{.CARGO}} clippy --locked --all-targets -- -D warnings'

  fmt:
    desc: Format Rust sources
    cmds:
      - '{{.CARGO}} fmt --all'

  fmt-check:
    internal: true
    cmds:
      - '{{.CARGO}} fmt --all -- --check'

  check:
    desc: Run formatting, lint, and tests
    deps: [fmt-check, lint, test]

  run:
    desc: Run xpdelve; pass arguments after --
    cmds:
      - '{{.CARGO}} run --locked -- {{.CLI_ARGS}}'

  demo:setup:
    desc: Create the vind cluster and install the xpdelve demo
    cmds:
      - ./demo/scripts/setup.sh

  demo:reset:
    desc: Recreate the root resource for another demo recording
    cmds:
      - ./demo/scripts/reset.sh

  demo:record:
    desc: Build xpdelve and record docs/assets/xpdelve.gif with VHS
    deps: [package]
    cmds:
      - ./demo/scripts/reset.sh
      - mkdir -p docs/assets
      - vhs demo/xpdelve.tape

  demo:destroy:
    desc: Delete the xpdelve vind demo cluster
    cmds:
      - ./demo/scripts/destroy.sh

  bench:
    desc: Run benchmarks when benchmarks are present
    cmds:
      - '{{.CARGO}} bench --locked {{.CLI_ARGS}}'

  package:
    desc: Build the release binary
    cmds:
      - '{{.CARGO}} build --locked --release'

  install:
    desc: Install the latest xpdelve release to ~/.local/bin
    silent: true
    cmds:
      - |
        set -eu

        repo="https://github.com/allanyung/xpdelve"
        latest_url="$(curl -fsSL -o /dev/null -w '%{url_effective}' "$repo/releases/latest")"
        tag="${latest_url##*/}"
        version="${tag#v}"

        case "$tag" in
          v[0-9]*) ;;
          *)
            printf 'Could not determine the latest xpdelve version from %s\n' "$latest_url" >&2
            exit 1
            ;;
        esac

        case "$(uname -s)" in
          Linux) os="Linux" ;;
          Darwin) os="Darwin" ;;
          *)
            printf 'Unsupported operating system: %s\n' "$(uname -s)" >&2
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch="x86_64" ;;
          arm64|aarch64) arch="arm64" ;;
          *)
            printf 'Unsupported architecture: %s\n' "$(uname -m)" >&2
            exit 1
            ;;
        esac

        archive="xpdelve_${version}_${os}_${arch}.tar.gz"
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT

        printf 'Downloading xpdelve %s for %s/%s...\n' "$version" "$os" "$arch"
        curl -fsSL "$repo/releases/download/$tag/$archive" -o "$tmpdir/$archive"
        tar -xzf "$tmpdir/$archive" -C "$tmpdir"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$tmpdir/xpdelve" "$HOME/.local/bin/xpdelve"

        if [ "$os" = "Darwin" ]; then
          xattr -d com.apple.quarantine "$HOME/.local/bin/xpdelve" 2>/dev/null || true
        fi

        printf 'Installed xpdelve %s to %s/.local/bin/xpdelve\n' "$version" "$HOME"

  ci:
    desc: Run the local CI quality gate
    cmds:
      - task: fmt-check
      - task: lint
      - task: test
      - task: package

  release:
    desc: Prepare, commit, and tag a release (VERSION=x.y.z)
    silent: true
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: "{{.VERSION}}"
    cmds:
      - |
        set -eu

        version="$RELEASE_VERSION"
        if ! python3 -c 'import re, sys; sys.exit(not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", sys.argv[1]))' "$version"; then
          printf 'VERSION must use x.y.z format without a v prefix\n' >&2
          exit 1
        fi

        tag="v$version"
        branch="$(git branch --show-current)"
        if [ "$branch" != "main" ]; then
          printf 'release must run from main (currently %s)\n' "$branch" >&2
          exit 1
        fi
        if [ -n "$(git status --porcelain)" ]; then
          printf 'release requires a clean worktree\n' >&2
          exit 1
        fi
        if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
          printf 'tag %s already exists\n' "$tag" >&2
          exit 1
        fi
        remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
        if [ -n "$remote_tag" ]; then
          printf 'tag %s already exists on origin\n' "$tag" >&2
          exit 1
        fi
        current_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
        if [ "$current_version" = "$version" ]; then
          printf 'Cargo.toml already declares version %s\n' "$version" >&2
          exit 1
        fi

        rollback() {
          git restore --source=HEAD --staged --worktree -- Cargo.toml Cargo.lock
        }
        trap rollback EXIT

        python3 - "$version" <<'PY'
        import re
        import sys
        from pathlib import Path

        manifest = Path("Cargo.toml")
        contents = manifest.read_text()
        updated, count = re.subn(
            r'(?m)^(version\s*=\s*")[^"]+("\s*)$',
            rf'\g<1>{sys.argv[1]}\g<2>',
            contents,
            count=1,
        )
        if count != 1:
            raise SystemExit("could not update the package version in Cargo.toml")
        manifest.write_text(updated)
        PY

        cargo update --offline -p xpdelve
        cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
        if [ "$cargo_version" != "$version" ]; then
          printf 'Cargo version %s does not match requested version %s\n' "$cargo_version" "$version" >&2
          exit 1
        fi

        task ci
        git add Cargo.toml Cargo.lock
        git commit -m "Release $tag"
        git tag -a "$tag" -m "Release $tag"
        trap - EXIT

        printf '\nRelease %s is committed and tagged locally. Push it with:\n\n' "$tag"
        printf '  git push origin main %s\n' "$tag"
