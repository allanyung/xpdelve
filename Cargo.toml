[package]
name = "xpdelve"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "A responsive Crossplane resource trace explorer"
repository = "https://github.com/allanyung/xpdelve"
readme = "README.md"
rust-version = "1.98.1"
keywords = ["crossplane", "kubernetes", "terminal", "tui"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
json-patch = "4"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", default-features = false, features = [
  "client",
  "rustls-tls",
  "aws-lc-rs",
  "jsonpatch",
] }
nix = { version = "0.30", features = ["process", "signal"] }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
similar = "2"
terminal-colorsaurus = "1"
unicode-width = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
