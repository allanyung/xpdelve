name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Validate tag and package version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' must look like v0.1.0"
            exit 1
          fi
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "v$cargo_version" != "$RELEASE_TAG" ]]; then
            echo "::error::Cargo version '$cargo_version' does not match '$RELEASE_TAG'"
            exit 1
          fi

      - name: Quality gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: Linux_x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: Linux_arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: Darwin_x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: Darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "target/${TARGET}/release/xpdelve" version
          "target/${TARGET}/release/xpdelve" --help >/dev/null

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          package="xpdelve_${version}_${ARTIFACT}"
          mkdir "$package"
          cp "target/${TARGET}/release/xpdelve" README.md LICENSE NOTICE "$package/"
          cp -R docs "$package/docs"
          tar -czf "${package}.tar.gz" "$package"
          shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpdelve-${{ matrix.artifact }}
          path: |
            xpdelve_*_${{ matrix.artifact }}.tar.gz
            xpdelve_*_${{ matrix.artifact }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
